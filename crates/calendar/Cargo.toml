[package]
name = "cal"
description = "Calendar sync (Google Calendar + CalDAV) for Ratatoskr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
rtsk = { path = "../core" }
db = { path = "../db" }
db-read = { path = "../db-read" }
action-types = { path = "../action-types" }
service-state = { path = "../service-state" }
sync = { path = "../sync" }
bifrost-types.workspace = true

serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
chrono-tz = "0.10"
rusqlite.workspace = true
tokio-util = "0.7"
log = "0.4"
uuid = { version = "1.23.1", features = ["v4"] }
hotpath = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread"] }
async-trait = "0.1"

[features]
hotpath = ["dep:hotpath", "hotpath/hotpath", "rtsk/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc", "rtsk/hotpath-alloc"]
