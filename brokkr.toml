project = "ratatoskr"

[test]
debug = true

# The [[check]] entry replaces brokkr's legacy fallback (one --all-features
# sweep) with the default-features build - the shape the runner and every
# consumer actually get. This is a deliberate behavior change: the first run
# may surface breakage --all-features was hiding (the piners-vm class, where a
# feature-gated path satisfied every call site the default build misses), and
# surfacing it is the point. When cfg-gated code wants coverage (dev-seed and
# friends), add package-scoped feature sweeps beside this entry rather than
# going back to --all-features.
#
# `parallel = {}` runs this 30-crate workspace's test binaries concurrently
# instead of sequentially - prebuilt binaries executed directly, budget =
# tests in flight, defaulting to the L3 cache domain. Judge it over two runs:
# the first warms the timing store by test count and is always the slow one,
# and a `claims 1-1` line on the second means the budget is too small for the
# pole binary and needs raising explicitly (see brokkr man config parallel).
# The [ratatoskr.gate.*] sync-harness gates below are untouched - they run
# through `brokkr sync`, not the check test phase.
[[check]]
name = "default"
parallel = {}

[[dependency_rule]]
name = "app-no-rusqlite"
from = "app"
forbid = "rusqlite"

[[dependency_rule]]
name = "core-no-rusqlite"
from = "rtsk"
forbid = "rusqlite"

[[dependency_rule]]
name = "core-no-writer-db"
from = "rtsk"
forbid = ["db", "rusqlite", "service-state", "service", "action-types"]

[[dependency_rule]]
name = "app-no-service-state"
from = "app"
forbid = "service-state"

[[dependency_rule]]
name = "app-no-db-internals"
from = "app"
forbid = ["db", "db-read", "rusqlite", "service-state", "service", "action-types", "common"]

[[dependency_rule]]
name = "service-no-app"
from = "service"
forbid = "app"

[[dependency_rule]]
name = "app-no-service-internals"
from = "app"
forbid = ["service", "service-state"]

# Bifrost is a SERVICE-side dependency. The app depends on `rtsk` plus the
# `service-api` wire types only, so any bifrost type that lands in `rtsk` is
# pulled into the UI build - which is why `rtsk` is fenced as well as `app`.
# The service-to-app IPC contract is the firewall; `AccountError` and friends
# never cross it. `action-types` and `cal` DO carry `bifrost-types`, and that
# is deliberate: it holds the `CalendarAccountOpener` trait that lets the
# calendar crate open an account without a circular dep on `service`. Those two
# are therefore absent here on purpose, not by oversight.
[[dependency_rule]]
name = "app-no-bifrost"
from = "app"
forbid = [
    "bifrost-types", "bifrost-net", "bifrost-sync", "bifrost-jmap",
    "bifrost-imap", "bifrost-graph", "bifrost-google", "bifrost-caldav",
    "bifrost-carddav",
]

[[dependency_rule]]
name = "core-no-bifrost"
from = "rtsk"
forbid = [
    "bifrost-types", "bifrost-net", "bifrost-sync", "bifrost-jmap",
    "bifrost-imap", "bifrost-graph", "bifrost-google", "bifrost-caldav",
    "bifrost-carddav",
]

[[dependency_rule]]
name = "common-stays-leafward"
from = "common"
forbid = ["sync", "rtsk", "service", "service-state", "cal", "app"]

[[dependency_rule]]
name = "core-no-upward"
from = "rtsk"
forbid = ["service", "service-state", "cal", "app"]

[[dependency_rule]]
name = "service-api-is-pure-leaf"
from = "service-api"
forbid = [
    "db", "db-read", "rusqlite",
    "rtsk", "service", "service-state", "action-types",
    "store", "search", "common", "cal", "calendar",
    "sync",
    "smart-folder", "seen", "ai", "import", "dev-seed",
    "app", "runner",
]

# dev-seed is intentionally allowed only through development feature flags.
# runner disables app default features for production and exposes
# `runner/dev-seed` as the explicit opt-in. The regression test in
# `crates/runner/src/main.rs` pins that manifest shape.

[[dependency_rule]]
name = "sync-no-upward"
from = "sync"
forbid = ["app", "service", "service-state", "cal"]

[[dependency_rule]]
name = "cal-no-app"
from = "cal"
forbid = "app"

[[dependency_rule]]
name = "seen-reader-only"
from = "seen"
forbid = ["db"]

[[dependency_rule]]
name = "smart-folder-reader-only"
from = "smart-folder"
forbid = ["db"]

