# The cost contract for shared mailboxes and public folders (B12c):
# a delta kick costs one mail delta per folder - personal AND foreign -
# with no per-kick delegate rediscovery, and one EWS FindItem watermark
# poll per PINNED public folder with none for unpinned ones and no
# hierarchy re-walk. The exact-matched detail counters are the load-
# bearing metrics: the public-folder request count must scale with the
# pin count, never the hierarchy size (obstacle O), and a foreign-delta
# count change means duplicated or dropped namespace legs.

